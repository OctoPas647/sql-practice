<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SQL Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="alasql.min.js"></script>
<style>
/* One question per screen. Green is kept for two things only: Submit and "correct". */
:root{
  --green:#04AA6D; --green-edge:#038A58; --green-ink:#037A4E;
  --paper:#FFFFFF; --ink:#282A35; --muted:#5E6371;
  --surface:#F1F4F6; --line:#D3D8DE; --mint:#E2F3EA;
  --red:#C8342C; --red-bg:#FDECEA; --ring:rgba(40,42,53,.16);
  --str:#9A4A1C; --num:#2759A6; --cmt:#6A737D; --scrim:rgba(24,27,36,.5);
  --key:#CC4E00;
  --sans:"Atkinson Hyperlegible Next","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:"Atkinson Hyperlegible Mono","Roboto Mono","Droid Sans Mono",Menlo,Consolas,monospace;
  --qsize:clamp(21px,4.1vh,34px);
  --csize:clamp(17px,3.05vh,26px);
  --tap:clamp(48px,7.4vh,64px);
  --fit:1;
  --btn:clamp(58px,8.6vh,74px);
  --pad:20px;
  color-scheme:light;
  box-sizing:border-box;
  height:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green-ink:#5BD69E;
    --paper:#1B2530; --ink:#EEF1F4; --muted:#A6AFB8;
    --surface:#243241; --line:#3A4A59; --mint:#1E3F31;
    --red:#FF8A80; --red-bg:#3E2226; --ring:rgba(238,241,244,.2);
    --str:#F0A58A; --num:#82AAFF; --cmt:#8B949E; --scrim:rgba(0,0,0,.6);
  --key:#FF9F4A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --green-ink:#5BD69E;
  --paper:#1B2530; --ink:#EEF1F4; --muted:#A6AFB8;
  --surface:#243241; --line:#3A4A59; --mint:#1E3F31;
  --red:#FF8A80; --red-bg:#3E2226; --ring:rgba(238,241,244,.2);
  --str:#F0A58A; --num:#82AAFF; --cmt:#8B949E; --scrim:rgba(0,0,0,.6);
  --key:#FF9F4A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:400 17px/1.4 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
/* No accidental text selection while tapping; typing fields stay selectable. */
.app,.win,.acct,.sheet{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input{-webkit-user-select:text;user-select:text}
/* Answer words, blanks and the big buttons handle every finger themselves. */
.chip,.blank,.submit,.next{touch-action:none}
/* No pinch-zoom on the question and green screens, so two fingers never turn into a zoom gesture. */
.app,.q,.win,.wincenter{touch-action:pan-y}
:focus{outline:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
code{font-family:var(--mono);font-size:.86em;font-weight:500;background:var(--surface);padding:.04em .3em;border-radius:6px}
.t-k,.t-f{font-weight:700}
.t-s{color:var(--str)} .t-n{color:var(--num)} .t-c{color:var(--cmt);font-style:italic}

/* ---------- question screen ---------- */
.app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column}
.bar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 12px}
.themebtn{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:8px;min-height:46px;margin-right:auto;padding:4px 8px 4px 14px;border:0;border-radius:999px;background:var(--surface);font-size:16px;font-weight:700}
.tbname{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbpos{flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.themebtn svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.me{flex:none;display:flex;align-items:center;gap:9px;min-height:46px;padding:4px 16px 4px 4px;border:0;border-radius:999px;background:var(--surface);font-size:17px;font-weight:700}
.me b{font-weight:800;font-variant-numeric:tabular-nums}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-size:18px;font-weight:800;line-height:1}
.avatar svg{width:62%;height:62%;fill:currentColor}

.q{--fit:1;flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:calc(16px*var(--fit));padding:calc(6px*var(--fit)) var(--pad) 16px}
.ask{flex:none;margin:0;font-size:calc(var(--qsize)*var(--fit));line-height:1.24;font-weight:700;text-wrap:pretty}
.ask code{font-size:.84em;font-weight:700}
.ask strong{font-weight:800}
.ask mark.key{background:none;color:var(--key)}

.code{flex:none;padding:calc(14px*var(--fit)) calc(16px*var(--fit));border-radius:16px;background:var(--surface);font:500 calc(var(--csize)*var(--fit))/1.95 var(--mono);white-space:pre-wrap;overflow-wrap:break-word}
.blank{display:inline-block;min-width:3.4ch;margin:0 .06em;padding:0 .3ch;border:2px dashed var(--muted);border-radius:9px;background:var(--paper);font:700 1em/1.45 var(--mono);color:var(--ink);text-align:center;vertical-align:baseline}
.blank.target{border:2px solid var(--ink);box-shadow:0 0 0 4px var(--ring)}
.blank.filled{border-style:solid;border-color:var(--line);background:var(--mint)}
.blank.filled.target{border-color:var(--ink)}
.blank.right{border-style:solid;border-color:var(--green);background:var(--mint);color:var(--green-ink)}
.blank.wrong{border-style:solid;border-color:var(--red);background:var(--red-bg);color:var(--red)}
.blank.given{border:2px solid transparent;background:none;color:var(--muted);cursor:default;text-decoration:underline dotted 2px;text-underline-offset:5px}
.blank.down{transform:scale(.94)}
.blank .ph{color:var(--muted);font-weight:500;letter-spacing:.05em}

.grow{flex:1 1 0;min-height:0}
.bank{flex:none;display:flex;flex-wrap:wrap;gap:calc(10px*var(--fit))}
.chip{flex:1 1 auto;min-width:calc(33.333% - 7px);min-height:calc(var(--tap)*var(--fit));padding:0 12px;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;background:var(--paper);font:700 calc(var(--csize)*var(--fit))/1.15 var(--mono);color:var(--ink);transition:transform .08s,border-bottom-width .08s}
.chip:active,.chip.down{transform:translateY(3px);border-bottom-width:2px}
.chip.used{border-style:dashed;border-bottom-width:2px;background:none;color:var(--muted);opacity:.6}

.editorbox{position:relative;flex:1 1 auto;min-height:calc(6em + 28px);font-size:calc(var(--csize)*var(--fit))}
.editor{position:absolute;inset:0;overflow:hidden;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.editor:focus-within{border-color:var(--ink)}
.editor pre,.editor textarea{position:absolute;inset:0;margin:0;padding:12px 14px 58px;border:0;font:500 1em/1.5 var(--mono);letter-spacing:0;tab-size:2;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal}
.editor pre{overflow:hidden;pointer-events:none;color:var(--ink)}
.editor pre code{display:block;padding:0;border-radius:0;background:none;font:inherit}
.editor textarea{width:100%;height:100%;overflow:auto;resize:none;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ink);scrollbar-width:none}
.editor textarea::-webkit-scrollbar{display:none}
.editor textarea::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1}
.editor textarea::selection{background:var(--ring)}
.tablesbtn{position:absolute;right:8px;bottom:8px;z-index:1;min-height:42px;padding:0 16px;border:2px solid var(--line);border-radius:999px;background:var(--paper);font-size:16px;font-weight:700}
.tablesbtn:active{background:var(--surface)}

.fb{flex:none;display:flex;flex-direction:column;gap:calc(6px*var(--fit))}
.fbmsg{margin:0;font-size:calc(19px*var(--fit));line-height:1.3;font-weight:700}
.fbmsg.bad{color:var(--red)}
.fbmsg.info{color:var(--ink)}
.fbpre{margin:0;max-height:5.6em;overflow:auto;padding:8px 12px;border-radius:12px;background:var(--red-bg);color:var(--ink);font:500 calc(15px*var(--fit))/1.4 var(--mono);white-space:pre}
.acts{display:flex;flex-wrap:wrap;column-gap:24px}
.textbtn{min-height:44px;padding:6px 0;border:0;background:none;font-size:calc(18px*var(--fit));font-weight:700;color:var(--ink);text-decoration:underline 2px;text-underline-offset:5px}
.bar .textbtn{font-size:17px;padding:6px 10px}

.submit,.next{flex:none;width:100%;height:calc(var(--btn)*max(var(--fit),.86));border:0;border-radius:18px;font-size:clamp(21px,3.2vh,26px);font-weight:800;letter-spacing:.01em;transition:transform .08s,box-shadow .08s}
.submit{background:var(--green);color:#fff;box-shadow:inset 0 -5px 0 var(--green-edge)}
.submit:active,.submit.down{transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--green-edge)}
.submit:focus-visible{outline-color:var(--green-edge)}

.shake{animation:shake .34s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

/* ---------- the green screen ---------- */
.win{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;padding:max(24px,env(safe-area-inset-top,0px)) var(--pad) max(16px,env(safe-area-inset-bottom,0px));background:var(--green);color:#fff;text-align:center}
.wincenter{flex:1;min-height:0;width:100%;max-width:720px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vh,16px)}
.tick{flex:none;width:clamp(88px,15vh,132px);height:auto}
.tick circle{fill:none;stroke:rgba(255,255,255,.4);stroke-width:5}
.tick path{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.win h2{margin:0;font-size:clamp(42px,7.6vh,66px);line-height:1.05;font-weight:800;letter-spacing:-.01em}
.winpts{margin:0;font-size:clamp(22px,3.6vh,30px);font-weight:700}
.winrow{margin:0;font-size:19px;font-weight:700}
.winwhy{margin:clamp(4px,1.2vh,12px) 0 0;max-width:34em;padding:14px 18px;border-radius:16px;background:rgba(0,0,0,.24);font-size:clamp(17px,2.5vh,20px);line-height:1.45;text-align:left}
.winwhy code{background:rgba(255,255,255,.2);color:#fff}
.next{max-width:720px;background:#fff;color:#037A4E;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.next:active,.next.down{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
.win :focus-visible{outline-color:#fff}
.win.show{animation:lit .55s ease-out}
.win.show h2{animation:pop .35s ease-out}
.win.show .tick circle{stroke-dasharray:296;stroke-dashoffset:296;animation:draw .42s ease-out forwards}
.win.show .tick path{stroke-dasharray:70;stroke-dashoffset:70;animation:draw .3s .22s ease-out forwards}
@keyframes lit{from{background:#3FDC9B}to{background:var(--green)}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- stats page ---------- */
.acct{position:fixed;inset:0;z-index:40;background:var(--paper)}
.acctin{--fit:1;height:100%;max-width:760px;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:calc(16px*var(--fit));padding:env(safe-area-inset-top,0px) var(--pad) calc(12px + env(safe-area-inset-bottom,0px))}
.acctbar{flex:none;height:56px;display:flex;align-items:center;margin:0 0 calc(-10px*var(--fit)) -10px}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 12px 0 4px;border:0;border-radius:12px;background:none;font-size:18px;font-weight:700}
.back svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.who{display:flex;align-items:flex-start;gap:16px}
.avatar.big{width:calc(68px*var(--fit));height:calc(68px*var(--fit));font-size:calc(30px*var(--fit))}
.whotext{flex:1;min-width:0}
.name{display:block;width:100%;margin:0;padding:0 0 2px;border:0;border-bottom:2px dashed var(--line);border-radius:0;background:none;font:800 calc(27px*var(--fit))/1.2 var(--sans);color:var(--ink)}
.name:focus{border-bottom:2px solid var(--ink)}
.name:focus-visible{outline:none}
.name::placeholder{color:var(--muted);opacity:1}
.whotext .meter{margin-top:calc(10px*var(--fit))}
.lvl{margin:2px 0 0;font-size:calc(18px*var(--fit));font-weight:700;color:var(--green-ink)}
.meter{display:block;height:8px;border-radius:99px;background:var(--surface);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:inherit;background:var(--green)}
.meter.big{height:12px}
.lvlnext{margin:6px 0 0;font-size:calc(16px*var(--fit));font-weight:600;color:var(--muted)}
.empty{margin:0;font-size:calc(17px*var(--fit));font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(18px*var(--fit)) 14px;margin:0}
.stat{display:flex;flex-direction:column-reverse;gap:2px}
.stat dt{font-size:calc(15px*var(--fit));font-weight:600;line-height:1.2;color:var(--muted)}
.stat dd{margin:0;font-size:calc(32px*var(--fit));font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stat dd small{font-size:.5em;font-weight:700;color:var(--muted)}
.track h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 calc(2px*var(--fit));font-size:calc(20px*var(--fit));font-weight:800}
.track h2 span{font-size:.85em;font-weight:700;color:var(--muted)}
.tracks{display:flex;flex-direction:column;gap:calc(18px*var(--fit))}
.topic{display:grid;grid-template-columns:minmax(0,1fr) calc(72px*var(--fit)) 3em;align-items:center;gap:12px;width:100%;min-height:calc(38px*var(--fit));padding:0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:calc(16.5px*var(--fit))}
.topic:last-child{border-bottom:0}
.topic:active{background:var(--surface)}
.topic .tn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic .tc{text-align:right;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.pagetitle{margin:0;font-size:calc(30px*var(--fit));line-height:1.1;font-weight:800}
.themelist{display:flex;flex-direction:column}
/* Each theme's bottom rule doubles as its progress bar. */
.themerow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;column-gap:12px;row-gap:2px;width:100%;padding:calc(9px*var(--fit)) 0 calc(10px*var(--fit)) 14px;border:0;text-align:left;
  background:linear-gradient(var(--green),var(--green)) left bottom/var(--done,0%) 3px no-repeat,linear-gradient(var(--line),var(--line)) left bottom/100% 1px no-repeat}
.themerow:active{background-color:var(--surface)}
.themerow.current{box-shadow:inset 4px 0 0 var(--ink)}
.trn{font-size:calc(19px*var(--fit));font-weight:800;line-height:1.25}
.trc{font-size:calc(16px*var(--fit));font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.trc.done{color:var(--green-ink)}
.tra{grid-column:1 / -1;font-size:calc(15px*var(--fit));line-height:1.3;color:var(--muted)}
.reset{flex:none;align-self:flex-start;margin-top:auto;color:var(--muted)}
.reset.armed{color:var(--red)}

/* ---------- bottom sheet: hints, tables, results ---------- */
.sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:760px;max-height:86%;margin:0 auto;display:flex;flex-direction:column;border-radius:22px 22px 0 0;background:var(--paper);box-shadow:0 -10px 34px rgba(0,0,0,.22);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(28px);opacity:.3}to{transform:none;opacity:1}}
.panelhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 4px var(--pad)}
.panelhead h2{margin:0;font-size:22px;font-weight:800}
.panelhead .textbtn{font-size:18px;padding:6px 8px}
.panelbody{overflow-y:auto;overscroll-behavior:contain;padding:4px var(--pad) calc(22px + env(safe-area-inset-bottom,0px));font-size:18px;line-height:1.45}
.hints{margin:0 0 4px;padding-left:1.5em}
.hints li{margin:0 0 14px;padding-left:.2em}
.hints li::marker{font-weight:800}
.hints p{margin:0}
.hcode{margin:8px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface);font:500 16px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:break-word}
.gap{padding:0 2px;border-radius:4px;background:var(--mint);font-weight:700}
.hnote{margin:0 0 14px;font-size:16px;font-weight:600;color:var(--muted)}
.sheetbtn{width:100%;min-height:56px;border:2px solid var(--ink);border-radius:16px;background:var(--paper);font-size:19px;font-weight:800}
.sheetbtn:active{background:var(--surface)}
.tbl{padding:12px 0;border-bottom:1px solid var(--line)}
.tbl:last-child{border-bottom:0}
.tbl h3{margin:0 0 8px;font-size:20px;font-weight:800}
.cols{margin:0;display:flex;flex-wrap:wrap;gap:6px}
.cols code{padding:4px 9px;font-size:15px}
.tbl .textbtn{font-size:16px}
.count{margin:0 0 6px;font-weight:700}
.sublabel{margin:0 0 4px;color:var(--muted)}
.warnline{margin:0 0 8px;padding:8px 12px;border-radius:10px;background:var(--red-bg);font-size:16px}
.scroll{overflow-x:auto;margin:6px 0 0;border:1px solid var(--line);border-radius:12px}
.rt{min-width:100%;border-collapse:collapse;font:500 15px/1.4 var(--mono)}
.rt th,.rt td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rt th{background:var(--surface);font-weight:700}
.rt tr:last-child td{border-bottom:0}
.null{color:var(--muted);font-style:italic}

/* ---------- short and sideways screens ---------- */
@media (max-height:500px){
  .bar{height:46px}
  .acctbar{height:44px}
  .editorbox{min-height:calc(3em + 28px)}
  .tick{display:none}
}
@media (min-aspect-ratio:4/3) and (max-height:540px){
  .app{max-width:none}
  .q{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"ask bank" "work bank" "work fb" "work submit";column-gap:28px}
  .ask{grid-area:ask}
  .code{grid-area:work;align-self:start}
  .editorbox{grid-area:work}
  .grow{display:none}
  .bank{grid-area:bank;align-self:end;align-content:flex-end}
  .fb{grid-area:fb}
  .submit{grid-area:submit}
  .themelist{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
}
@media (prefers-reduced-motion: reduce){
  .win.show,.win.show h2,.panel,.shake{animation:none}
  .win.show .tick *{animation:none;stroke-dashoffset:0}
  .chip,.submit,.next{transition:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <button type="button" class="themebtn" id="themeBtn">
      <span class="tbname" id="tbName"></span><span class="tbpos" id="tbPos"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button type="button" class="me" id="meBtn">
      <span class="avatar" id="meAvatar" aria-hidden="true"></span>
      <span aria-hidden="true"><b id="mePts">0</b> pts</span>
    </button>
  </header>

  <main class="q" id="q">
    <h1 class="ask" id="ask" tabindex="-1"></h1>
    <div class="code" id="code" hidden></div>
    <div class="editorbox" id="editorbox" hidden>
      <div class="editor">
        <pre aria-hidden="true"><code id="hl"></code></pre>
        <textarea id="sql" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Type your SQL here" aria-label="Your SQL query"></textarea>
        <button type="button" class="tablesbtn" id="tablesBtn">Tables</button>
      </div>
    </div>
    <div class="grow" id="grow"></div>
    <div class="bank" id="bank" hidden role="group" aria-label="Answers"></div>
    <div class="fb" id="fb" hidden>
      <p class="fbmsg" id="fbMsg" role="status"></p>
      <pre class="fbpre" id="fbPre" hidden></pre>
      <div class="acts" id="acts" hidden>
        <button type="button" class="textbtn" id="hintBtn">Hint</button>
        <button type="button" class="textbtn" id="resultBtn" hidden>See your result</button>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const IDENT = {};

// AlaSQL reserves a few words that real databases happily accept as column names, so
// "SUM(Price) AS Total" or "COUNT(*) AS Count" would be a syntax error. Those names get quoted.
const SOFT_KW = new Set('TOTAL COUNT SUM AVG VALUE FIRST LAST INDEX PERCENT'.split(' '));

function splitSQL(src){
  const out = []; let cur = ''; let i = 0; const n = src.length;
  while (i < n){
    const ch = src[i], nx = src[i+1];
    if (ch === '-' && nx === '-'){ while (i < n && src[i] !== '\n') i++; continue; }
    if (ch === '/' && nx === '*'){ const j = src.indexOf('*/', i+2); i = j < 0 ? n : j+2; cur += ' '; continue; }
    if (ch === "'" || ch === '"' || ch === '`'){
      let j = i+1;
      while (j < n){ if (src[j] === ch){ if (src[j+1] === ch){ j += 2; continue; } break; } j++; }
      cur += src.slice(i, j+1); i = j+1; continue;
    }
    if (ch === ';'){ if (cur.trim()) out.push(cur.trim()); cur = ''; i++; continue; }
    cur += ch; i++;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function canon(stmt){
  const soft = new Set();
  stmt.replace(/('(?:[^']|'')*'|"(?:[^"]|"")*"|`[^`]*`)|\bAS\s+([A-Za-z_][A-Za-z0-9_]*)\b/gi,
    (m, q, a) => { if (a && SOFT_KW.has(a.toUpperCase())) soft.add(a.toUpperCase()); return m; });
  return stmt.replace(/('(?:[^']|'')*'|"(?:[^"]|"")*"|`[^`]*`)|\b([A-Za-z_][A-Za-z0-9_]*)\b/g, (m, q, w, at, s) => {
    if (q) return q;
    // An alias like Total is quoted wherever it appears, but COUNT(...) stays a function call.
    if (soft.has(w.toUpperCase()) && s[at - 1] !== '.' && !/^\s*\(/.test(s.slice(at + m.length))) return '`' + w + '`';
    return IDENT[w.toLowerCase()] || w;
  });
}

const KW = new Set('SELECT FROM WHERE AND OR NOT IN IS NULL LIKE BETWEEN ORDER BY GROUP HAVING LIMIT OFFSET JOIN INNER LEFT RIGHT FULL OUTER CROSS ON AS DISTINCT INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE DROP ALTER ADD COLUMN UNION ALL EXISTS CASE WHEN THEN ELSE END ASC DESC TOP TRUE FALSE PRIMARY KEY'.split(' '));
const FN = new Set('COUNT SUM AVG MIN MAX UPPER LOWER LENGTH LEN ROUND COALESCE IFNULL SUBSTRING ABS'.split(' '));
function highlight(src){
  return src.replace(/(--[^\n]*)|('(?:[^']|'')*'?)|("(?:[^"]|"")*"?)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_][A-Za-z0-9_]*)\b|([&<>])/g,
    (m, c, s1, s2, n, w, x) => {

      if (s1 || s2) return '<span class="t-s">' + esc(s1 || s2) + '</span>';
      if (n) return '<span class="t-n">' + n + '</span>';
      if (w){ const U = w.toUpperCase(); if (KW.has(U)) return '<span class="t-k">' + w + '</span>'; if (FN.has(U)) return '<span class="t-f">' + w + '</span>'; return w; }
      return esc(x);
    });
}

// Challenges: a hint ladder that gets closer to the answer with every press.
function skeleton(sql){
  const toks = []; const re = /('(?:[^']|'')*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)?)|(\s+)|([\s\S])/g;
  let m;
  while ((m = re.exec(sql))){
    if (m[1] || m[2]) toks.push({ s:m[0], blank:true });
    else if (m[3]){ const U = m[3].toUpperCase(); toks.push({ s:m[0], blank: !(KW.has(U) || FN.has(U)) }); }
    else toks.push({ s:m[0], blank:false });
  }
  return toks;
}
function buildLadder(c){
  const toks = skeleton(c.solution);
  const n = toks.filter(t => t.blank).length;
  const steps = [
    { text: c.hints[0] },
    { text: c.hints[1] },
    { text: 'Here is the shape of the answer. The keywords are in place; fill in the names and values:', code: toks.map(t => t.blank ? '___' : t.s).join('') }
  ];
  if (n > 1){
    const leave = Math.ceil(n / 3); let seen = 0;
    const code = toks.map(t => { if (!t.blank) return t.s; seen++; return seen > n - leave ? '___' : t.s; }).join('');
    steps.push({ text: 'Almost there. Only ' + (leave === 1 ? 'the last blank is' : 'the last ' + leave + ' blanks are') + ' left:', code });
  }
  return steps;
}
CH.forEach(c => { c.kind = 'ch'; c.ladder = buildLadder(c); });

// Exercises: parse [[answer|alternative]] blanks out of the template.
function parseTemplate(code){
  const parts = []; const re = /\[\[(.+?)\]\]/g; let last = 0, m;
  while ((m = re.exec(code))){
    parts.push({ t: code.slice(last, m.index) });
    const alts = m[1].split('|');
    parts.push({ b: alts[0], alts });
    last = re.lastIndex;
  }
  parts.push({ t: code.slice(last) });
  return parts;
}

// Word bank: the answers plus a few look-alike decoys, in a stable shuffled order.
const KWPOOL = ['SELECT','FROM','WHERE','AND','OR','NOT','IN','IS','NULL','LIKE','BETWEEN','ORDER','BY','GROUP','HAVING','DESC','ASC','LIMIT','DISTINCT','AS','JOIN','ON','LEFT','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','DROP','ALTER','ADD','COUNT','SUM','MIN','MAX','AVG'];
const COLPOOL = [...new Set(TABLES.flatMap(t => t.cols.map(c => c[0])))];
const SYMPOOL = ['%','_','<','>','=','*'];
const LITPOOL = ['Paris','Munich','Madrid','London','Rome','Dublin'];
function seeded(str){
  let h = 2166136261;
  for (const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  h = (h >>> 0) || 1;
  return () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
}
function category(w){
  if (KWPOOL.includes(w.toUpperCase())) return 'kw';
  if (IDENT[w.toLowerCase()]) return 'col';
  if (/^[^A-Za-z0-9]+$/.test(w)) return 'sym';
  return 'lit';
}
function bankFor(ex){
  if (ex._bank) return ex._bank;
  const rnd = seeded(ex.id);
  const answers = ex.blanks.map(b => b.b);
  const taken = new Set(answers.map(a => a.toUpperCase()));
  const cats = [...new Set(answers.map(category))];
  const pools = { kw:KWPOOL, col:COLPOOL, sym:SYMPOOL, lit:LITPOOL };
  const extra = (ex.decoys || []).filter(w => !taken.has(w.toUpperCase())); let guard = 0;
  extra.forEach(w => taken.add(w.toUpperCase()));
  while (extra.length < 3 && guard++ < 300){
    const pool = pools[cats[extra.length % cats.length]];
    const w = pool[Math.floor(rnd() * pool.length)];
    if (!taken.has(w.toUpperCase())){ taken.add(w.toUpperCase()); extra.push(w); }
  }
  const all = [...answers, ...extra];
  for (let i = all.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  return ex._bank = all;
}

/* ---------------- engine ---------------- */
let engineReady = false;
let dbn = 0;
function freshDB(){
  const id = 'practice' + (++dbn);
  const db = new alasql.Database(id);
  for (const t of TABLES){
    db.exec('CREATE TABLE ' + t.name + ' (' + t.cols.map(c => c[0] + ' ' + c[1]).join(', ') + ')');
    db.tables[t.name].data = t.rows.map(r => { const o = {}; t.cols.forEach((c, i) => { o[c[0]] = r[i]; }); return o; });
  }
  return db;
}
function dropDB(db){ try { delete alasql.databases[db.databaseid]; } catch(e){} }

function cleanError(e){
  let m = (e && e.message) ? e.message : String(e);
  const t = m.match(/Table does not exist:\s*([\w.]+)/i);
  if (t) return 'There is no table called "' + t[1] + '". The tables are: ' + TABLES.map(x => x.name).join(', ') + '.';
  if (/^Parse error/i.test(m)){
    const lines = m.split('\n');
    return 'The SQL has a syntax error near the ^ mark:\n' + (lines[1] || '') + '\n' + (lines[2] || '');
  }
  const f = m.match(/alasql\.fn\.(\w+) is not a function/i);
  if (f) return 'There is no function called ' + f[1] + '. Check the spelling.';
  if (/Cannot read prop|undefined is not an object|is not defined/i.test(m)){
    return 'Something in the query points to a table, alias or column that does not exist. Check your spelling and aliases.\n(' + m + ')';
  }
  return m;
}

const expCache = {};
function expected(ch){
  if (expCache[ch.id]) return expCache[ch.id];
  const db = freshDB();
  try {
    let last;
    for (const s of splitSQL(ch.solution)) last = db.exec(canon(s));
    expCache[ch.id] = ch.check ? db.exec(ch.check) : last;
  } finally { dropDB(db); }
  return expCache[ch.id];
}
function describe(res){
  if (typeof res === 'number') return res + (res === 1 ? ' row affected.' : ' rows affected.');
  if (Array.isArray(res)) return res.length + ' rows returned.';
  return 'Statement ran.';
}
function toMatrix(rows){
  const cols = []; const seen = new Set();
  for (const r of rows) for (const k of Object.keys(r)) if (!seen.has(k)){ seen.add(k); cols.push(k); }
  const norm = v => {
    if (v === null || v === undefined) return '\u2205';
    if (typeof v === 'number') return String(Math.round(v * 100) / 100);
    if (v instanceof Date) return v.toISOString();
    return String(v);
  };
  return { cols, data: rows.map(r => cols.map(c => norm(r[c]))) };
}
function sameBag(a, b){ const x = [...a].sort(), y = [...b].sort(); return x.length === y.length && x.every((k, i) => k === y[i]); }
function compare(userRows, expRows, ordered, isChange){
  const u = toMatrix(userRows), e = toMatrix(expRows);
  if (u.data.length !== e.data.length){
    return { ok:false, msg: isChange
      ? 'After your statement the table has ' + u.data.length + ' rows. It should have ' + e.data.length + '.'
      : 'Your query returned ' + u.data.length + (u.data.length === 1 ? ' row' : ' rows') + '. The answer has ' + e.data.length + '.' };
  }
  if (u.cols.length !== e.cols.length){
    // Two result columns with the same name (e.FirstName, m.FirstName) come back as one.
    const merged = u.cols.length < e.cols.length ? ' If two of your columns have the same name, give one of them a new name with AS.' : '';
    return { ok:false, msg:'You have the right number of rows, but ' + u.cols.length + (u.cols.length === 1 ? ' column' : ' columns') + '. The answer has ' + e.cols.length + '.' + merged };
  }
  const key = r => JSON.stringify(r);
  const keyS = r => JSON.stringify([...r].sort());
  const ue = u.data.map(key), ee = e.data.map(key), us = u.data.map(keyS), es = e.data.map(keyS);
  if (ordered){
    if (ue.every((k, i) => k === ee[i]) || us.every((k, i) => k === es[i])) return { ok:true };
    if (sameBag(ue, ee) || sameBag(us, es)) return { ok:false, msg:'Those are the right rows, but not in the right order. Check your ORDER BY.' };
  } else if (sameBag(ue, ee) || sameBag(us, es)) return { ok:true };
  return { ok:false, msg: isChange
    ? 'The table doesn\'t look right yet. Check which rows your statement changed and the values you used.'
    : 'Right number of rows and columns, but some values don\'t match. Check your conditions.' };
}

function evaluate(ch, sql){
  const out = {};
  const stmts = splitSQL(sql);
  if (!stmts.length){
    out.verdict = { ok:false, msg:'Write a SQL statement in the editor first.' };
    out.outcome = 'The editor is empty.';
    return out;
  }
  const db = freshDB();
  let checkRows = null;
  try {
    const results = [];
    for (const s of stmts) results.push(db.exec(canon(s)));
    const last = results[results.length - 1];
    const lastSel = [...results].reverse().find(r => Array.isArray(r));
    if (ch.check){
      checkRows = db.exec(ch.check);
      if (Array.isArray(last)){ out.rows = last; }
      else { out.message = describe(last); out.rows = checkRows; out.label = ch.checkTable + ' after your change:'; }
    } else if (lastSel){ out.rows = lastSel; if (!Array.isArray(last)) out.message = describe(last); }
    else { out.message = describe(last); }
  } catch(e){ out.error = cleanError(e); }
  finally { dropDB(db); }

  if (out.error){ out.outcome = 'Running it gives this error: ' + out.error; return out; }
  let exp;
  try { exp = expected(ch); } catch(e){
    out.verdict = { ok:false, msg:'The checker could not work out the expected answer for this challenge.' };
    out.outcome = out.verdict.msg; return out;
  }
  if (ch.check){ out.verdict = compare(checkRows, exp, false, true); }
  else if (!out.rows){ out.verdict = { ok:false, msg:'This challenge needs a SELECT query that returns rows.' }; }
  else { out.verdict = compare(out.rows, exp, !!ch.ordered, false); }
  out.outcome = out.verdict.ok ? 'It already returns the correct result.' : out.verdict.msg;
  return out;
}

const WORDCH = /[A-Za-z0-9_]/;
// Wraps each key phrase (whole words, exact case, first free match) in <mark class="key">.
// Returns what it did so the rule can be checked: [{key, sentence, words}] and any skipped keys.
function highlightKeys(root, keys){
  const nodes = []; let text = '';
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n; (n = walk.nextNode()); ){ nodes.push({ n, start:text.length }); text += n.data; }
  const sentenceAt = []; let s = 0;
  for (let i = 0; i < text.length; i++){
    sentenceAt[i] = s;
    if ('.?!'.includes(text[i]) && (i + 1 === text.length || /\s/.test(text[i + 1]))) s++;
  }
  const used = {}, picks = [], skipped = [];
  for (const k of keys){
    const words = k.trim().split(/\s+/).length;
    let at = -1, from = 0;
    for (;;){
      at = text.indexOf(k, from);
      if (at < 0) break;
      const end = at + k.length;
      const edges = (at === 0 || !WORDCH.test(text[at - 1])) && (end === text.length || !WORDCH.test(text[end]));
      if (edges && !picks.some(p => at < p.end && end > p.start)) break;
      from = at + 1;
    }
    const node = at < 0 ? null : nodes.find(x => at >= x.start && at + k.length <= x.start + x.n.data.length);
    const si = at < 0 ? -1 : sentenceAt[at];
    if (!node || (used[si] || 0) + words > MAX_KEY_WORDS){ skipped.push(k); continue; }
    used[si] = (used[si] || 0) + words;
    picks.push({ key:k, start:at, end:at + k.length, node, sentence:si, words });
  }
  picks.slice().sort((x, y) => y.start - x.start).forEach(p => {
    const r = document.createRange();
    r.setStart(p.node.n, p.start - p.node.start);
    r.setEnd(p.node.n, p.end - p.node.start);
    const m = document.createElement('mark'); m.className = 'key';
    r.surroundContents(m);
  });
  return { picks: picks.map(p => ({ key:p.key, sentence:p.sentence, words:p.words })), skipped };
}

// `review`, going back over a theme you had already finished: then Next steps through it in order.
function isOpen(x){ return !state.solved[x.id]; }

  for (let k = 1; k < THEMES.length; k++){
    const o = THEMES[(ti + k) % THEMES.length].items.find(isOpen);
    if (o) return { id:o.id, label:'Next theme' };
  }
  return { id:null, label:'See your stats' };
}
function showWin(it, gained, finished){
  // Submitting a shown answer isn't "Correct!", even on a question you'd already solved.
  const earned = gained !== 0 && !visit.shown;
  $('#winTitle').textContent = earned ? 'Correct!' : 'That\u2019s the answer';
  if (earned) playWinSound();
  $('#winPts').textContent = gained === 'already' ? 'Already solved' : gained > 0 ? '+' + plural(gained, 'point', 'points') : 'No points this time';
  const row = state.stats.streak, rowEl = $('#winRow');
  rowEl.textContent = finished ? 'You finished ' + finished.name : gained !== 0 && visit.counted && row >= 2 ? row + ' in a row' : '';
  rowEl.hidden = !rowEl.textContent;
  $('#winWhy').innerHTML = it.explain;
  $('#nextBtn').textContent = winNext.label;
  const w = $('#win');
  w.hidden = false; w.classList.remove('show'); void w.offsetWidth; w.classList.add('show');
  $('#app').setAttribute('inert', '');
  $('#nextBtn').focus({ preventScroll:true });
  paintBars();
}
function hideWin(){
  const w = $('#win'); if (w.hidden) return;
  w.hidden = true; w.classList.remove('show');
  $('#app').removeAttribute('inert');
  paintBars();
}
function nextTap(){
  const n = (winNext || nextStep(item(), false)).id;
  hideWin();
  if (n) openItem(n, true); else openAcct();
}

/* ---------------- multi-touch taps ---------------- */
// Every finger is tracked on its own, so two thumbs can tap two words at the same time
// (or overlap their taps), and a finger resting on the screen doesn't block other taps.
// A tap counts when the finger lifts on the same button it pressed.
// Mouse, keyboard and TalkBack still go through the normal click event.
const TAPS = [['#bank .chip', chipTap], ['#code .blank', blankTap], ['#submitBtn', submit], ['#nextBtn', nextTap]];
function tapTarget(t){
  if (!t || !t.closest) return null;
  for (const [sel, fn] of TAPS){ const el = t.closest(sel); if (el) return { el, fn }; }
  return null;
}
const usable = el => el.isConnected && !el.disabled && !el.closest('[inert]') && !el.closest('[hidden]');
const fingers = new Map();
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  const hit = tapTarget(e.target);
  if (!hit || !usable(hit.el)) return;
  fingers.set(e.pointerId, hit);
  hit.el.classList.add('down');
});
document.addEventListener('pointerup', e => {
  const hit = fingers.get(e.pointerId); if (!hit) return;
  fingers.delete(e.pointerId);
  hit.el.classList.remove('down');
  const r = hit.el.getBoundingClientRect(), slop = 10;
  const inside = e.clientX >= r.left - slop && e.clientX <= r.right + slop && e.clientY >= r.top - slop && e.clientY <= r.bottom + slop;
  if (!inside || !usable(hit.el)) return;
  hit.el._tapAt = performance.now();
  hit.fn(hit.el);
});
document.addEventListener('pointercancel', e => {
  const hit = fingers.get(e.pointerId);
  if (hit){ hit.el.classList.remove('down'); fingers.delete(e.pointerId); }
});
// Stop the browser's own click after a touch tap. Otherwise tapping Submit could also
// "click" the Next button that appears in the same spot.
document.addEventListener('touchend', e => { if (e.cancelable && tapTarget(e.target)) e.preventDefault(); }, { passive:false });
document.addEventListener('click', e => {
  const hit = tapTarget(e.target);
  if (!hit || !usable(hit.el)) return;
  if (hit.el._tapAt && performance.now() - hit.el._tapAt < 700) return;   // already handled as a touch tap
  hit.fn(hit.el);
});

/* ---------------- hints and answers ---------------- */
function useHint(it){
  const k = state.help[it.id] || 0;
  if (k >= helpMax(it)) return;
  state.help[it.id] = k + 1;
  if (it.kind === 'ex'){
    if (k + 1 >= 3) revealOneBlank(it);
    ex.marks = null;
    paintBlanks();
    saveDraft();
  }
  save();
}
function revealOneBlank(it){
  let i = ex.vals.findIndex((v, j) => !isGiven(j) && !blankRight(it, j, v || ''));
  if (i < 0) i = ex.vals.findIndex((v, j) => !isGiven(j));
  if (i < 0) return;
  ex.given.push(i);
  ex.vals[i] = it.blanks[i].b;
  if (ex.last === i) ex.last = null;
  if (ex.active === i) ex.active = firstEmpty();
}
function renderHints(){
  const it = item(), k = state.help[it.id] || 0, max = helpMax(it);
  let rows = [];
  if (it.kind === 'ch'){
    rows = it.ladder.slice(0, k).map(s => '<li><p>' + s.text + '</p>' + (s.code ? '<pre class="hcode">' + hlGaps(s.code) + '</pre>' : '') + '</li>');
  } else {
    rows.push('<li><p>' + esc(it.hint) + '</p></li>');
    if (k >= 2) rows.push('<li><p>The first letter of each missing word is now in its blank.</p></li>');
    ex.given.slice().sort((a, b) => a - b).forEach(i => rows.push('<li><p>Blank ' + (i + 1) + ' is filled in for you.</p></li>'));
  }
  const now = worthNow(it);
  let note;
  if (state.solved[it.id]) note = 'You\u2019ve already solved this one.';
  else if (state.revealed[it.id]) note = 'The answer was shown, so this one is worth 0 points.';
  else if (k < max){ const after = worthAt(it, k + 1); note = 'Worth ' + plural(now, 'point', 'points') + ' now.' + (after < now ? ' Another hint lowers it to ' + after + '.' : ''); }
  else note = 'That\u2019s every hint. Worth ' + plural(now, 'point', 'points') + ' now.';
  openSheet(k > 1 ? 'Hints' : 'Hint',
    '<ol class="hints">' + rows.join('') + '</ol><p class="hnote">' + note + '</p>' +
    (k < max ? '<button type="button" class="sheetbtn" id="moreHint">Show another hint</button>' : ''));
  const more = $('#moreHint');
  if (more) more.onclick = () => { useHint(it); renderHints(); };
}
$('#hintBtn').onclick = () => { const it = item(); if (!state.help[it.id]) useHint(it); renderHints(); };

$('#answerBtn').onclick = () => {
  const it = item();
  if (!state.solved[it.id] && !state.revealed[it.id]) state.revealed[it.id] = true;
  visit.shown = true;
  if (it.kind === 'ch'){ editor.value = it.solution; editor.scrollTop = 0; updateHL(); }
  else { ex.vals = it.blanks.map(b => b.b); ex.active = null; ex.last = null; ex.marks = null; paintBlanks(); }
  saveDraft(); save();
  setFb('Here\u2019s the answer. Tap Submit to continue.', 'info');
};

/* ---------------- bottom sheet ---------------- */
let sheetReturn = null;
function openSheet(title, html){
  const sh = $('#sheet');
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = html;
  $('#sheetBody').scrollTop = 0;
  if (sh.hidden){ sheetReturn = document.activeElement; sh.hidden = false; $('#app').setAttribute('inert', ''); }
  ($('#moreHint') || $('#sheetClose')).focus({ preventScroll:true });
}
function closeSheet(){
  const sh = $('#sheet'); if (sh.hidden) return;
  sh.hidden = true;
  if ($('#win').hidden && $('#acct').hidden && $('#themes').hidden) $('#app').removeAttribute('inert');
  if (sheetReturn && sheetReturn.isConnected) sheetReturn.focus({ preventScroll:true });
  renderFb();
}
$('#sheetClose').onclick = closeSheet;
$('#sheetScrim').onclick = closeSheet;

function cell(v, dec){
  if (v === null || v === undefined) return '<span class="null">NULL</span>';
  if (typeof v === 'number') return dec ? (Math.round(v * 100) / 100).toFixed(2) : String(v);
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (v instanceof Date) return esc(v.toISOString().slice(0, 10));
  if (typeof v === 'object') return esc(JSON.stringify(v));
  return esc(v);
}
function tableHTML(rows){
  if (!rows.length) return '<p class="sublabel">No rows.</p>';
  const { cols } = toMatrix(rows);
  const dec = cols.map(c => rows.some(r => typeof r[c] === 'number' && !Number.isInteger(r[c])));
  return '<div class="scroll"><table class="rt"><thead><tr>' + cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + cols.map((c, i) => '<td>' + cell(r[c], dec[i]) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}
function emptyColumnWarning(rows){
  if (!rows || !rows.length) return '';
  const { cols } = toMatrix(rows);
  const bad = cols.filter(c => rows.every(r => r[c] === undefined));
  if (!bad.length) return '';
  return '<p class="warnline">' + bad.map(b => '<strong>' + esc(b) + '</strong>').join(', ') + (bad.length === 1 ? ' is' : ' are') +
    ' empty in every row. That usually means the column name is misspelled or belongs to a different table.</p>';
}
$('#resultBtn').onclick = () => {
  const r = visit.run; if (!r) return;
  let h = '';
  if (r.message) h += '<p class="count">' + esc(r.message) + '</p>';
  if (r.rows){
    if (r.label) h += '<p class="sublabel">' + esc(r.label) + '</p>';
    h += '<p class="count">' + plural(r.rows.length, 'row', 'rows') + '</p>' + emptyColumnWarning(r.rows) + tableHTML(r.rows);
  }
  openSheet('Your result', h);
};
const rowObjects = t => t.rows.map(r => Object.fromEntries(t.cols.map((c, i) => [c[0], r[i]])));
$('#tablesBtn').onclick = () => {
  openSheet('Tables', TABLES.map((t, i) =>
    '<section class="tbl"><h3>' + t.name + '</h3><p class="cols">' + t.cols.map(c => '<code>' + c[0] + '</code>').join(' ') + '</p>' +
    '<button type="button" class="textbtn" data-t="' + i + '" aria-expanded="false">Show the ' + t.rows.length + ' rows</button><div hidden></div></section>').join(''));
};
$('#sheetBody').addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  const t = TABLES[+b.dataset.t], box = b.nextElementSibling, open = box.hidden;
  if (open && !box.innerHTML) box.innerHTML = tableHTML(rowObjects(t));
  box.hidden = !open;
  b.setAttribute('aria-expanded', String(open));
  b.textContent = open ? 'Hide rows' : 'Show the ' + t.rows.length + ' rows';
});

/* ---------------- themes screen ---------------- */
function renderThemes(){
  const cur = item().theme;
  $('#themeList').innerHTML = THEMES.map(t => {
    const d = t.items.filter(i => state.solved[i.id]).length, n = t.items.length, all = d === n;
    return '<button type="button" class="themerow' + (t.id === cur ? ' current' : '') + '" data-theme="' + t.id + '" style="--done:' + Math.round(d / n * 100) + '%"' +
      (t.id === cur ? ' aria-current="true"' : '') + ' aria-label="' + esc(t.name) + ', ' + d + ' of ' + n + ' solved. ' + esc(t.about) + '">' +
      '<span class="trn">' + esc(t.name) + '</span><span class="trc' + (all ? ' done' : '') + '" aria-hidden="true">' + (all ? 'Done' : d + '/' + n) + '</span>' +
      '<span class="tra" aria-hidden="true">' + esc(t.about) + '</span></button>';
  }).join('');
}
function openThemes(){
  renderThemes();
  $('#themes').hidden = false;
  $('#themesIn').scrollTop = 0;
  $('#app').setAttribute('inert', '');
  fitSoon();
  const cur = $('#themeList .current');
  (cur || $('#themesBack')).focus({ preventScroll:true });
}
function closeThemes(){
  $('#themes').hidden = true;
  $('#app').removeAttribute('inert');
  $('#themeBtn').focus({ preventScroll:true });
}
$('#themeBtn').onclick = openThemes;
$('#themesBack').onclick = closeThemes;
$('#themeList').addEventListener('click', e => {
  const b = e.target.closest('.themerow'); if (!b) return;
  const t = THEME_BY[b.dataset.theme];
  const target = t.items.find(i => !state.solved[i.id]) || t.items[0];
  closeThemes();
  openItem(target.id, true);
});

/* ---------------- stats page ---------------- */
function avatarHTML(){ const c = Array.from(state.name.trim())[0]; return c ? esc(c.toUpperCase()) : PERSON; }
function renderMe(){
  const pts = totalPoints();
  $('#meAvatar').innerHTML = avatarHTML();
  $('#mePts').textContent = pts;
  $('#meBtn').setAttribute('aria-label', 'Your stats, ' + plural(pts, 'point', 'points'));
}
function renderAcct(){
  const pts = totalPoints(), L = levelInfo(pts), s = state.stats;
  const solved = Object.keys(state.solved).filter(id => byId(id));
  const clean = solved.filter(id => state.solved[id].how === 'clean').length;
  $('#acctAvatar').innerHTML = avatarHTML();
  if (document.activeElement !== $('#nameInput')) $('#nameInput').value = state.name;
  $('#lvlName').textContent = L.name;
  $('#lvlFill').style.width = Math.round(Math.max(0, Math.min(1, L.pct)) * 100) + '%';
  $('#lvlNext').textContent = L.next ? plural(L.next[0] - pts, 'point', 'points') + ' to ' + L.next[1] : 'Top level reached';
  $('#emptyNote').hidden = !!(s.attempts || solved.length);
  const stats = [
    [pts, 'Points'],
    [solved.length + '<small>/' + ALL.length + '</small>', 'Solved'],
    [s.attempts ? Math.round(s.correct / s.attempts * 100) + '<small>%</small>' : '\u2013', 'Accuracy'],
    [s.best, 'Best streak'],
    [dayStreak(), 'Day streak'],
    [clean, 'Without hints']
  ];
  $('#stats').innerHTML = stats.map(([v, l]) => '<div class="stat"><dt>' + l + '</dt><dd>' + v + '</dd></div>').join('');
}
function openAcct(){
  renderAcct();
  $('#acct').hidden = false;
  $('#acctIn').scrollTop = 0;
  $('#app').setAttribute('inert', '');
  fitSoon();
  $('#acctBack').focus({ preventScroll:true });
}
function closeAcct(){
  disarmReset();
  $('#acct').hidden = true;
  $('#app').removeAttribute('inert');
  $('#meBtn').focus({ preventScroll:true });
}
$('#meBtn').onclick = openAcct;
$('#acctBack').onclick = closeAcct;
$('#nameInput').addEventListener('input', e => {
  state.name = e.target.value.slice(0, 24);
  save();
  $('#acctAvatar').innerHTML = avatarHTML();
  renderMe();
});
$('#nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

let resetArmed = null;
function disarmReset(){
  clearTimeout(resetArmed); resetArmed = null;
  const b = $('#resetBtn'); b.textContent = 'Reset progress'; b.classList.remove('armed');
}
$('#resetBtn').onclick = () => {
  const b = $('#resetBtn');
  if (!resetArmed){ b.textContent = 'Tap again to erase all progress'; b.classList.add('armed'); resetArmed = setTimeout(disarmReset, 4000); return; }
  disarmReset();
  state.solved = {}; state.help = {}; state.revealed = {}; state.drafts = {};
  state.stats = { attempts:0, correct:0, streak:0, best:0, days:[] };
  save();
  shownId = null;
  openItem(ALL[0].id);
  renderMe(); renderAcct(); fitSoon();
};

/* ---------------- open a question ---------------- */
function openItem(id, focusQ){
  if (!byId(id)) return;
  saveDraft();
  curId = id; state.current = id; save();
  const it = item(), isCh = it.kind === 'ch';
  const t = themeOf(it), idx = t.items.indexOf(it);
  visit = { counted:false, missed:false, shown:false, run:null };
  $('#tbName').textContent = t.name;
  $('#tbPos').textContent = (idx + 1) + '/' + t.items.length;
  $('#themeBtn').setAttribute('aria-label', t.name + ', question ' + (idx + 1) + ' of ' + t.items.length + '. Choose a theme');
  $('#ask').innerHTML = it.task;
  highlightKeys($('#ask'), KEYS[it.id] || []);
  $('#code').hidden = isCh; $('#bank').hidden = isCh; $('#grow').hidden = isCh;
  $('#editorbox').hidden = !isCh;
  if (isCh){ const d = state.drafts[id]; editor.value = typeof d === 'string' ? d : ''; editor.scrollTop = 0; updateHL(); }
  else renderExercise(it);
  shownId = id;
  fbMsg = null; renderFb();
  qBox.scrollTop = 0;
  if (focusQ) $('#ask').focus({ preventScroll:true });
  fitSoon();
}

/* ---------------- fit everything on one screen ---------------- */
// Start at full size and step the type down until nothing overflows.
let fitRaf = 0;
function fitSoon(){
  cancelAnimationFrame(fitRaf);
  fitRaf = requestAnimationFrame(() => { fitBox(qBox, .6); if (!$('#acct').hidden) fitBox($('#acctIn'), .8); if (!$('#themes').hidden) fitBox($('#themesIn'), .8); });
}
function fitBox(el, min){
  let f = 1;
  el.style.setProperty('--fit', '1');
  while (f > min + 0.001 && el.scrollHeight > el.clientHeight + 1){
    f = Math.round((f - 0.05) * 100) / 100;
    el.style.setProperty('--fit', String(f));
  }
}
addEventListener('resize', fitSoon);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSoon);

/* ---------------- Android: colour the status and navigation bars to match ---------------- */
function paintBars(){
  const bridge = window.AndroidApp;
  if (!bridge || typeof bridge.postMessage !== 'function') return;
  const green = !$('#win').hidden;
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const paper = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim().toUpperCase();
  try { bridge.postMessage('bars ' + (green ? '#04AA6D' : paper) + ' ' + (green || dark ? 'light' : 'dark')); } catch(e){}
}
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
if (darkQuery.addEventListener) darkQuery.addEventListener('change', paintBars);

// The Android back button closes whatever is on top first.
window.__androidBack = () => {
  if (!$('#sheet').hidden){ closeSheet(); return true; }
  if (!$('#win').hidden){ hideWin(); return true; }
  if (!$('#acct').hidden){ closeAcct(); return true; }
  if (!$('#themes').hidden){ closeThemes(); return true; }
  return false;
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && window.__androidBack()) e.preventDefault(); });

/* ---------------- boot ---------------- */
renderMe();
openItem(curId);
paintBars();

const FALLBACKS = [
  'https://cdn.jsdelivr.net/npm/alasql@4.4.0/dist/alasql.min.js',
  'https://cdn.jsdelivr.net/npm/alasql@4.0.0/dist/alasql.min.js',
  'https://cdn.jsdelivr.net/npm/alasql@1.7.3/dist/alasql.min.js'
];
function loadEngine(i){
  return new Promise((resolve, reject) => {
    if (window.alasql) return resolve();
    if (i >= FALLBACKS.length) return reject();
    const s = document.createElement('script');
    s.src = FALLBACKS[i];
    s.onload = () => window.alasql ? resolve() : loadEngine(i + 1).then(resolve, reject);
    s.onerror = () => loadEngine(i + 1).then(resolve, reject);
    document.head.appendChild(s);
  });
}
let engineLoading = false;
function startEngine(){
  if (engineReady || engineLoading) return;
  engineLoading = true; engineFailed = false;
  loadEngine(0).then(() => { engineReady = true; }, () => { engineFailed = true; }).then(() => { engineLoading = false; });
}
startEngine();
</script>
